name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build and test
        env:
          BATOPLEX_NO_NATIVE: "1"
        run: sh test/run.sh
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test/out/

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Cache the visualizer build
        uses: actions/cache@v4
        with:
          path: |
            native/.cache
            native/bpx-milkdrop
          key: native-${{ hashFiles('native/build.sh', 'native/bpx-milkdrop.cpp') }}
      - name: Build the bundle
        run: sh tools/build.sh
      - name: Check that the bundle has the visualizer
        run: tar tzf dist/batoplex-*.tar.gz | grep -q '/native/bpx-milkdrop$'
      - name: Check that the tag matches the app version
        run: |
          V=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' batoplex/config.py)
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match VERSION $V"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/batoplex-*.tar.gz dist/*.sha256 dist/projectm-*-src.tar.gz --title "$GITHUB_REF_NAME" --generate-notes --draft
